# =============================================================================
# SONDA: el sitio publicado, en un Chromium de verdad, con las fuentes de verdad.
#
# A mano y TEMPORAL. pruebas/vivo.js verifica las reglas con fuentes simuladas;
# lo que no puede verificar es lo unico que decide si esto anda: que el
# NAVEGADOR (con su CORS de verdad, desde el origen de GitHub Pages) reciba las
# respuestas de data912 y de CNBC y que la pastilla termine diciendo "en vivo".
# La maquina de desarrollo no tiene salida a esas dos; el runner si.
# =============================================================================
name: Sonda vivo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Abrir el sitio y mirar
        run: |
          cat > sonda.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const URL='https://jcruzburgos04-ops.github.io/Screener/?sonda='+Date.now();
            const b=await chromium.launch(), p=await b.newPage();
            const resp=[], caidas=[], errores=[];
            p.on('response',r=>{const u=r.url();if(/data912|cnbc/.test(u))
              resp.push(`${r.status()} ${u.slice(0,90)}`);});
            p.on('requestfailed',r=>{const u=r.url();if(/data912|cnbc/.test(u))
              caidas.push(`${(r.failure()||{}).errorText} ${u.slice(0,90)}`);});
            p.on('pageerror',e=>errores.push('pageerror '+e));
            p.on('console',m=>{if(m.type()==='error')errores.push('console '+m.text());});
            await p.goto(URL,{waitUntil:'load',timeout:120000});
            await p.waitForFunction(()=>document.querySelectorAll('#tabla tbody tr').length>0,null,{timeout:180000});
            console.log('tiene el codigo nuevo:',await p.evaluate(()=>typeof URL_CNBC==='string'));
            try{await p.waitForFunction(()=>isFinite(VIVO.ts)||VIVO.error,null,{timeout:90000});}
            catch(e){console.log('VIVO no llego a leer nada en 90 s');}
            const v=await p.evaluate(()=>({rueda:VIVO.rueda,ts:VIVO.ts,cubiertos:VIVO.cubiertos,
              cambiados:VIVO.cambiados,descartados:VIVO.descartados,porFuente:VIVO.porFuente,
              caidas:VIVO.caidas,sinFuente:VIVO.sinFuente,error:VIVO.error}));
            console.log('VIVO:',JSON.stringify(v,null,1));
            const pas=await p.evaluate(()=>{const e=document.querySelector('#frescura');
              return {texto:e.textContent,clase:e.className,title:e.title};});
            console.log('pastilla:',JSON.stringify(pas,null,1));
            const muestra=await p.evaluate(()=>['AAPL','SPY','QQQ','XLK','BAS.DE','PETR3.SA','6701.T','000660.KS']
              .map(t=>{const s=DATOS.simbolos.find(x=>x.t===t);
                return s?`${t} ${s.d.at(-1)} c=${s.c.at(-1)} h=${s.h.at(-1)} l=${s.l.at(-1)} v=${s.v.at(-1)}`:t+' -';}));
            console.log('muestra:\n  '+muestra.join('\n  '));
            console.log('respuestas:\n  '+resp.join('\n  '));
            console.log('pedidos caidos:\n  '+(caidas.join('\n  ')||'ninguno'));
            console.log('errores de la pagina:\n  '+(errores.join('\n  ')||'ninguno'));
            await b.close();
          })().catch(e=>{console.error('EXPLOTO',e);process.exit(1);});
          JS
          node sonda.js
