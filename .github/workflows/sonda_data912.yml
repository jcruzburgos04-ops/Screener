# =============================================================================
# SONDA: ¿data912 deja que el navegador le pida precios directo?
#
# A mano y TEMPORAL: contesta una pregunta y se borra, como sonda_velocidad.py.
#
# Primera pasada (23/9/2026): SI manda CORS (allow-origin: *, preflight OK,
# cache 30 s), trae ultimo precio y variacion pero NO open/high/low, y cubre
# 342 de 493 del universo. Quedaban afuera TODOS los ETF (SPY, QQQ, XL*, EW*),
# que son justamente los paneles de Indices y Sectores de Panorama.
#
# Segunda pasada: que endpoints existen de verdad (el openapi), si alguno trae
# ETFs, como escribe los tickers con punto (BRK-B / BRK.B), y si el precio se
# mueve entre dos lecturas separadas un minuto -- o sea, cuan fresco es.
# =============================================================================
name: Sonda data912

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Endpoints, ETFs, tickers con punto y frescura
        run: |
          python - <<'PY'
          import json, time, urllib.request

          def bajar(ruta):
              req = urllib.request.Request("https://data912.com/" + ruta.lstrip("/"),
                                           headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read())

          api = bajar("openapi.json")
          rutas = sorted(api.get("paths", {}))
          print(f"{len(rutas)} endpoints:")
          for r in rutas:
              print("  ", r, "·", ",".join(api["paths"][r].keys()))

          vivos = [r for r in rutas if r.startswith("/live/") and "{" not in r]
          buscar = ["SPY", "QQQ", "XLK", "EWZ", "GLD", "IWM", "BRK-B", "BRK.B",
                    "BRKB", "AKO-B", "AKO.B", "JOYY", "CAJPY", "SIEGY"]
          donde = {s: [] for s in buscar}
          for r in vivos:
              try:
                  d = bajar(r)
              except Exception as e:
                  print(f"{r}: ERROR {e}"); continue
              syms = {f.get("symbol") for f in d if isinstance(f, dict)}
              print(f"{r}: {len(d)} filas")
              for s in buscar:
                  if s in syms:
                      donde[s].append(r)
          print("\ndonde aparece cada uno:")
          for s, rs in donde.items():
              print(f"  {s:7s} {' '.join(rs) or '-- en ninguno'}")

          # frescura: dos lecturas separadas 60 s. Si nada se mueve, el dato
          # esta congelado o muy demorado; si se mueve, es de la rueda en curso.
          vigilar = ["AAPL", "MSFT", "NVDA", "TSLA", "AMD", "META", "AMZN", "KO"]
          a = {f["symbol"]: f for f in bajar("live/usa_stocks")}
          t0 = time.strftime("%H:%M:%S", time.gmtime())
          time.sleep(60)
          b = {f["symbol"]: f for f in bajar("live/usa_stocks")}
          t1 = time.strftime("%H:%M:%S", time.gmtime())
          print(f"\nfrescura, {t0} -> {t1} UTC:")
          movidos = 0
          for s in vigilar:
              ca, cb = a[s]["c"], b[s]["c"]
              qa, qb = a[s]["q_op"], b[s]["q_op"]
              movidos += (ca != cb) or (qa != qb)
              print(f"  {s:5s} c {ca} -> {cb}   operaciones {qa} -> {qb}")
          print(f"se movieron {movidos} de {len(vigilar)}")
          PY
