# Prueba el payload de renta fija contra las fuentes de verdad y lo imprime
# entero. A mano, no en cron: el que publica es intradia.yml, que lo arma junto
# con los precios. Este sirve para mirar la salida cuando se toca bonos.py o el
# cronograma, que es donde estan los numeros que despues nadie vuelve a revisar.
name: Bonos
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bonos:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: La cuenta y los cronogramas, contra la referencia
        run: python pruebas/renta_fija.py
      - name: Los futuros, solos (A3 + BCRA)
        run: python futuros.py
      - name: Armar el payload con datos de verdad
        run: |
          python bonos.py --salida /tmp/sitio
          python - <<'PY'
          import json
          d=json.load(open('/tmp/sitio/bonos.json'))
          print(f"fecha {d['fecha']} | bonos {len(d['bonos'])} | pares {len(d['canje'])} "
                f"| con TIR {d['con_tir']} | verificados {d['verificados']} "
                f"| ONs {len(d.get('ons',[]))}")
          print()
          print(f"{'bono':<6}{'pesos':>12}{'MEP':>9}{'cable':>9}{'tc MEP':>10}{'tc cable':>10}{'brecha':>9}")
          for b in d['bonos']:
              print(f"{b['t']:<6}{b['pesos']:>12,.0f}{(b['usd_mep'] or 0):>9.2f}"
                    f"{(b['usd_cable'] or 0):>9.2f}{(b['tc_mep'] or 0):>10,.0f}"
                    f"{(b['tc_cable'] or 0):>10,.0f}{(b.get('brecha') or 0)*100:>8.2f}%")
          print()
          print("rendimientos (sobre el precio en dolares MEP):")
          print(f"{'bono':<6}{'TIR':>8}{'TNA':>8}{'paridad':>9}{'durat':>7}"
                f"{'DV01':>8}{'vivo':>7}{'pagos':>7}  prox pago")
          for b in d['bonos']:
              if b.get('tir') is None:
                  print(f"{b['t']:<6}  (sin cronograma cargado)"); continue
              print(f"{b['t']:<6}{b['tir']*100:>7.2f}%{b['tna']*100:>7.2f}%"
                    f"{b['paridad']*100:>8.1f}%{b['duration']:>7.2f}{b['dv01']:>8.4f}"
                    f"{b['vivo']:>7.0f}{b['pagos']:>7}  {b['prox_pago']}"
                    + ('' if b.get('verificado') else '   [PROVISORIO]'))
          print()
          print("canje de leyes (NY / ARG, en dolares MEP):")
          for pr in d['canje']:
              print(f"  {pr['arg']} vs {pr['ny']}  ({pr['vto']}):  {pr['ratio']}")
          print()
          # La columna que importa es la ultima: `dib` dice si el papel entra al
          # grafico. Lo decide bonos.py por volumen, asi que esta consola y la
          # pagina dicen exactamente lo mismo -- si alguna vez discrepan, es
          # que alguien duplico la regla en el frontend.
          print("curvas en pesos (dib = entra al grafico; el resto no opero hoy):")
          for c in d.get('pesos', []):
              print(f"  {c['titulo']} ({len(c['filas'])} papeles, "
                    f"{c.get('operados', 0)} operaron):")
              print(f"    {'ticker':<9}{'vto':<12}{'dias':>6}{'precio':>12}"
                    f"{'TNA':>8}{'TIR':>8}{'TEM':>8}{'volumen':>12}  dib"
                    f"  {'prox pago':<12}{'en':>6}{'cobra':>11}  ULT/+")
              for x in c['filas']:
                  pg = x.get('pago') or {}
                  print(f"    {x['t']:<9}{x['vto']:<12}{x['dias']:>6}{x['precio']:>12,.2f}"
                        f"{(x['tna'] or 0)*100:>7.2f}%{(x['tir'] or 0)*100:>7.2f}%"
                        f"{(x['tem'] or 0)*100:>7.2f}%{(x['volumen'] or 0):>12,.2f}"
                        f"  {'si' if x.get('opero') else '--'}"
                        f"  {pg.get('fecha') or '-':<12}"
                        f"{(pg.get('dias') if pg else None) or 0:>6}"
                        f"{pg.get('monto') or 0:>11,.2f}"
                        f"  {'ULT' if pg.get('ultimo') else ('+' if pg else '')}")
          print()
          quietos = [(c['titulo'], x) for c in d.get('pesos', [])
                     for x in c['filas'] if not x.get('opero')]
          print(f"sin operar hoy: {quietos and len(quietos) or 0} de "
                f"{sum(len(c['filas']) for c in d.get('pesos', []))}")
          for t, x in quietos:
              print(f"  {t:<14} {x['t']:<8} TEM {(x['tem'] or 0)*100:7.2f}% "
                    f"dias {x['dias']:>5}  volumen {(x['volumen'] or 0):,.2f}")
          print()
          print(f"futuros: {len(d.get('futuros',[]))} contratos · spot {d.get('spot')} "
                f"({d.get('spot_fuente')})")
          print()
          # LO QUE HUBIERA CAZADO EL BUG DE LA FECHA DEL PANEL: nuestros dias
          # tienen que dar lo mismo que los de la fuente. Cuando se tomaba el
          # estimation_date de la PRIMERA fila y esa venia rancia, el panel
          # entero quedaba corrido 43 dias y en la pantalla no se notaba,
          # porque las fechas seguian viendose plausibles. Aca si se nota.
          print(f"dia del panel segun la fuente: {d.get('fecha_panel')}")
          desvios = [(o['t'], o['dias'], o['dias_fuente'])
                     for o in d.get('ons', [])
                     if o.get('dias_fuente') is not None
                     and o.get('dias') is not None
                     and abs(o['dias'] - o['dias_fuente']) > 1]
          # UNAS POCAS filas que difieren por dos o tres dias NO son un
          # problema: son papeles que la fuente valuo hace un par de dias, y
          # cada uno trae su propia fecha. Contra la compra de HOY el numero
          # bueno es el nuestro. Lo que si es un problema es que difiera MUCHA
          # gente o por MUCHO: eso es la fecha del panel corrida, que es lo que
          # ya paso una vez y no se vio en la pantalla.
          total_ons = len([o for o in d.get('ons', []) if o.get('dias_fuente')])
          grande = [x for x in desvios if abs(x[1] - x[2]) > 7]
          sistematico = total_ons and len(desvios) > total_ons * 0.10
          if grande or sistematico:
              print(f"  [!] LA FECHA DEL PANEL PARECE CORRIDA: {len(desvios)} de "
                    f"{total_ons} especies no coinciden con la fuente")
          elif desvios:
              print(f"  plazos: {len(desvios)} de {total_ons} difieren por pocos "
                    f"dias (la fuente las valuo antes; el nuestro es el de hoy)")
          else:
              print(f"  plazos: coinciden con la fuente en las {total_ons}")
          for t, nuestro, suyo in desvios[:10]:
              print(f"      {t:<9} nuestro {nuestro:>6}   fuente {suyo:>6}")
          print()
          # El proximo pago de las ONs: ULT marca las que ya entraron en su
          # ultimo tramo, o sea las que quedan con el cronograma COMPLETO.
          ons = d.get('ons', [])
          conp = [o for o in ons if o.get('pago')]
          ult = [o for o in conp if o['pago'].get('ultimo')]
          print(f"ONs: {len(ons)} especies · {len(conp)} con proximo pago · "
                f"{len(ult)} en su ultimo tramo")
          print(f"  {'especie':<9}{'vence':<12}{'dias':>6}  {'prox pago':<12}"
                f"{'en':>6}{'cobra':>11}  ULT/+")
          for o in sorted(conp, key=lambda x: x['pago']['dias'])[:15]:
              p = o['pago']
              print(f"  {o['t']:<9}{o['vto'] or '-':<12}{o['dias'] or 0:>6}  "
                    f"{p['fecha']:<12}{p['dias']:>6}{p.get('monto') or 0:>11,.2f}"
                    f"  {'ULT' if p['ultimo'] else '+'}")
          print()
          print("obligaciones negociables por emisor (TIR de bonistas, no propia):")
          for e in d.get('emisores', [])[:25]:
              t = f"{e['tir_med']*100:.2f}%" if e['tir_med'] is not None else '   ·  '
              print(f"  {t:>7}  {e['papeles']:>3} especies   {e['emisor']}")
          faltan = len(d.get('emisores', [])) - 25
          if faltan > 0:
              print(f"  ... y {faltan} emisores mas")

          print()
          # EL COBRO FINAL YA NO SALE DE UNA LISTA DE FAMILIAS: se verifica
          # contra el precio (ver _cobro_final). El riesgo de eso es que si la
          # fuente cambia como expresa la TIR, la columna se vaciaria EN
          # SILENCIO. Aca se ve: por familia, cuantos ultimos pagos afirman su
          # cobro y cuantos no. Si una familia que siempre afirmo deja de
          # hacerlo de un dia para el otro, es esto y no el mercado.
          print("cobro final verificado, por curva (afirmados / ultimos pagos):")
          for c in d.get('pesos', []):
              ults = [x for x in c['filas'] if (x.get('pago') or {}).get('ultimo')]
              con = [x for x in ults if (x.get('pago') or {}).get('cobra')]
              if not ults:
                  continue
              print(f"  {c['titulo']:<16} {len(con):>3} / {len(ults):<3}"
                    + ("   (ninguno: su TIR no esta en pesos nominales)"
                       if not con else ""))

          print()
          print("sinteticos: letra en pesos + futuro = tasa en DOLARES")
          sin = d.get('sinteticos', [])
          print(f"  {'letra':<8}{'futuro':<11}{'dias':>5}{'desc':>6}"
                f"{'$ entra':>10}{'$ sale':>10}{'deval':>8}{'TNA':>8}{'TEA':>8}")
          for x in sin:
              pc = lambda v: f"{v*100:6.2f}%" if v is not None else "     ·"
              print(f"  {x['t']:<8}{x['futuro']:<11}{x['dias']:>5}{x['descalce']:>6}"
                    f"{x['tc_entrada']:>10,.2f}{x['tc_salida']:>10,.2f}"
                    f"{pc(x['devaluacion']):>8}{pc(x['tna']):>8}{pc(x['tea']):>8}"
                    + (f"   {x['motivo']}" if x.get('motivo') else ""))
          # El descalce se mide entre FECHAS. Si vuelve a medirse entre plazos,
          # los pares que vencen el mismo dia dejan de dar cero y se ve aca.
          exactos = [x for x in sin if x['descalce'] == 0]
          print(f"  {len(exactos)} de {len(sin)} calzan exacto (mismo vencimiento)")

          print()
          print("sinteticos: dolar linked + futuro = tasa en PESOS")
          dl = d.get('sinteticos_dl', [])
          print(f"  {'bono':<8}{'futuro':<11}{'dias':>5}{'desc':>6}"
                f"{'$ bono':>10}{'$ fut':>10}{'dif':>8}{'TEA usd':>9}"
                f"{'TEA $':>9}{'fija':>8}{'contra':>8}")
          for x in dl:
              pc = lambda v: f"{v*100:6.2f}%" if v is not None else "     ·"
              print(f"  {x['t']:<8}{x['futuro']:<11}{x['dias']:>5}{x['descalce']:>6}"
                    f"{x['tc_bono']:>10,.2f}{x['tc_futuro']:>10,.2f}"
                    f"{pc(x['dif_tc']):>8}{pc(x['tea_usd']):>9}{pc(x['tea_ars']):>9}"
                    f"{pc(x['fija']):>8}{pc(x['contra_fija']):>8}"
                    + (f"   {x['motivo']}" if x.get('motivo') else ""))
          PY
