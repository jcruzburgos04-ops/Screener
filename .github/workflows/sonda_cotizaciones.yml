# =============================================================================
# SONDA: ¿quien cubre lo que data912 no cubre?
#
# A mano y TEMPORAL: contesta una pregunta y se borra, como sonda_data912.yml.
#
# data912 da en vivo 342 de 493 y deja afuera TODOS los ETF (los paneles de
# Indices y Sectores de Panorama) y todo lo que cotiza fuera de EE.UU. (.SA,
# .DE, .PA, .T, .TW, .KS, .IL). Aca se prueba cada candidata contra ESOS
# papeles y contra una muestra de acciones de EE.UU. (para saber si sirve de
# respaldo cuando data912 se cae), y se mide lo que decide si se puede usar:
#
#   - CORS: si la respuesta trae access-control-allow-origin para el origen
#     de GitHub Pages. Sin eso el navegador la tira, como pasa con Yahoo.
#   - que el precio CIERRE contra el ultimo cierre publicado (8%): un ticker
#     igual puede ser otra empresa (el caso SI) u otra moneda (peniques).
#   - que campos trae: apertura, maximo, minimo, volumen.
#   - si se mueve entre dos lecturas separadas un minuto.
# =============================================================================
name: Sonda cotizaciones

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: "Segunda pasada: CNBC contra data912 y Yahoo, moneda y tamano de lote"
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.parse
          ORIGEN = "https://jcruzburgos04-ops.github.io"
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          def pedir(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Origin": ORIGEN})
              t = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, dict(r.headers), r.read(), time.time() - t
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read()[:300], time.time() - t
          def cnbc(simbolos):
              u = ("https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols="
                   + urllib.parse.quote("|".join(simbolos)) +
                   "&requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json&events=1")
              st, cab, cu, dt = pedir(u)
              try:
                  q = json.loads(cu)["FormattedQuoteResult"]["FormattedQuote"]
                  q = q if isinstance(q, list) else [q]
              except Exception:
                  q = []
              return st, len(cu), dt, {f.get("symbol"): f for f in q}, cu
          def num(x):
              try: return float(str(x).replace(",", ""))
              except Exception: return None

          datos = json.loads(pedir("https://raw.githubusercontent.com/jcruzburgos04-ops/Screener/gh-pages/datos.json")[2])
          S = {s["t"]: s for s in datos["simbolos"]}

          # 1) mismo instante: data912, CNBC y Yahoo sobre acciones y ETFs
          mues = ["AAPL", "MSFT", "NVDA", "KO", "JPM", "MELI", "TSM", "XOM", "BRK.B"]
          etf = ["SPY", "QQQ", "IWM", "XLK", "GLD", "EWZ", "TLT"]
          d9 = {}
          for u in ("https://data912.com/live/usa_stocks", "https://data912.com/live/usa_adrs"):
              d9.update({f["symbol"]: f["c"] for f in json.loads(pedir(u)[2])})
          st, tam, dt, q, _ = cnbc(mues + etf)
          def yahoo(t):
              try:
                  m = json.loads(pedir(f"https://query1.finance.yahoo.com/v8/finance/chart/{t.replace('.', '-')}?range=1d&interval=1m")[2])["chart"]["result"][0]["meta"]
                  return m.get("regularMarketPrice"), time.strftime("%H:%M:%S", time.gmtime(m.get("regularMarketTime", 0)))
              except Exception as e:
                  return None, str(e)[:30]
          print(f"mismo instante ({time.strftime('%H:%M:%S', time.gmtime())} UTC):")
          print(f"  {'sym':6s} {'data912':>9s} {'CNBC':>9s} {'Yahoo':>9s}  CNBC-Yahoo  CNBC last_time          Yahoo hora")
          for t in mues + etf:
              f = q.get(t, {})
              c = num(f.get("last")); y, yh = yahoo(t)
              dif = f"{(c/y-1)*100:+.3f}%" if c and y else "-"
              print(f"  {t:6s} {str(d9.get(t,'-')):>9s} {str(c):>9s} {str(y):>9s}  {dif:>9s}   {f.get('last_time','-'):24s} {yh}")
              print(f"         campos: open={f.get('open')} high={f.get('high')} low={f.get('low')} volume={f.get('volume')} prev={f.get('previous_day_closing')} curmktstatus={f.get('curmktstatus')} realTime={f.get('realTime')} provider={f.get('provider')}")

          # 2) las bolsas de afuera: moneda de CNBC contra la del payload, y ABEV3
          PAIS = {"SA": "BR", "DE": "DE", "PA": "FR", "T": "JP", "TW": "TW", "KS": "KR", "IL": "UK"}
          fuera = [t for t in S if "." in t[1:]]
          variantes = []
          for t in fuera:
              b, s = t.rsplit(".", 1)
              variantes += [f"{b}-{PAIS[s]}", t]
          st, tam, dt, q, _ = cnbc(variantes)
          print("\nbolsas de afuera: variante · precio · moneda CNBC · moneda payload · cierre publicado · last_time · nombre")
          for t in fuera:
              b, s = t.rsplit(".", 1)
              for v in (f"{b}-{PAIS[s]}", t):
                  f = q.get(v)
                  if f:
                      print(f"  {t:10s} {v:10s} {f.get('last'):>10s} {str(f.get('currencyCode')):4s} {S[t].get('mon'):4s} {S[t]['c'][-1]:>10.2f}  {f.get('last_time','-'):24s} {f.get('name')}")
                  else:
                      print(f"  {t:10s} {v:10s} -- nada")
          # extra para los dos que faltaron: otras formas
          st, tam, dt, q, _ = cnbc(["000660-KR", "000660.KS", "SMSN-GB", "SMSN.L", "SMSNl.L", "SMSN-UK", "005930-KR", "SSNLF", "SSNHZ", "HXSCF", "HXSCL"])
          print("  otras formas para Samsung y SK Hynix:", {k: (v.get("last"), v.get("currencyCode"), v.get("name")) for k, v in q.items()})

          # 3) tamano de lote: 40, 100, 200 y 480 simbolos
          todos = [t.replace("-", ".") if "." not in t[1:] else t for t in S]
          for n in (40, 100, 200, len(todos)):
              st, tam, dt, q, cu = cnbc(todos[:n])
              print(f"\nlote de {n}: HTTP {st}, {len(q)} devueltos, {tam/1024:.0f} KB, {dt:.2f} s" + ("" if q else f" -> {cu[:200]!r}"))
          PY

