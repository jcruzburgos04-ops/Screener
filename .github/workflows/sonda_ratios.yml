# =============================================================================
# SONDA TEMPORAL: ¿alguna fuente publica el RATIO de cada CEDEAR?
# Hace falta para el valor teorico del CEDEAR en Estrategia. Se borra despues
# de contestar, como las sondas anteriores.
# =============================================================================
name: Sonda ratios CEDEAR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preguntar
        run: |
          python3 - <<'PY'
          import json, urllib.request
          def pedir(url, cuerpo=None):
              h = {"User-Agent": "Mozilla/5.0", "Content-Type": "application/json",
                   "Accept": "application/json, text/plain, */*"}
              data = json.dumps(cuerpo).encode() if cuerpo is not None else None
              r = urllib.request.Request(url, data=data, headers=h)
              with urllib.request.urlopen(r, timeout=30) as f:
                  return f.status, f.read()
          def mostrar(nombre, url, cuerpo=None):
              print("\n=====", nombre, url)
              try:
                  st, b = pedir(url, cuerpo)
                  print("status", st, "bytes", len(b))
                  try:
                      j = json.loads(b)
                  except Exception:
                      print(b[:800]); return
                  filas = j if isinstance(j, list) else j.get("data", j)
                  if isinstance(filas, dict):
                      print("claves", list(filas)[:40]); print(json.dumps(filas)[:1500]); return
                  print("filas", len(filas))
                  if filas:
                      print("claves", list(filas[0]))
                      for f in filas[:3]:
                          print(json.dumps(f)[:700])
                      for f in filas:
                          s = json.dumps(f)
                          if '"AAPL' in s or '"SPCX' in s or '"KO"' in s or '"NVDA' in s:
                              print("  >>", s[:700])
              except Exception as e:
                  print("error", repr(e)[:300])
          base = "https://open.bymadata.com.ar/vanoms-be-core/rest/api/bymadata/free/bnown/fichatecnica/especies/"
          for x in ("cedears", "cedear", "condiciones", "emision", "programa", "ratio", "general"):
              mostrar("BYMA ficha " + x, base + x, {"symbol": "AAPL", "Content-Type": "application/json"})
          import re
          for u in ("https://www.comafi.com.ar/custodiaglobal/2483-Programas-Cedear.note.aspx",
                    "https://www.comafi.com.ar/custodiaglobal/Programas-CEDEARs-2483.note.aspx",
                    "https://www.byma.com.ar/cedears/",
                    "https://www.byma.com.ar/productos/productos-de-renta-variable/cedears/"):
              print("\n=====", u)
              try:
                  st, b = pedir(u)
                  t = b.decode("utf-8", "replace")
                  print("status", st, "bytes", len(b))
                  for m in re.finditer(r"(?i)ratio", t):
                      print("  ...", re.sub(r"\s+", " ", t[max(0, m.start()-200):m.start()+300]))
                      break
                  for m in re.finditer(r'href="([^"]+\.(?:xlsx?|pdf|csv))"', t):
                      print("  archivo:", m.group(1))
              except Exception as e:
                  print("error", repr(e)[:300])
          PY
