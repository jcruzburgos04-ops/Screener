name: Sonda de fuentes
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Buscar cronogramas, campos de data912 y variantes de BYMA
        run: python sonda_fuentes.py || true
