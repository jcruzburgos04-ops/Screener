name: Sonda de curvas y futuros
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Familias de instrumentos y fuentes de futuros
        run: python sonda_curvas.py || true
