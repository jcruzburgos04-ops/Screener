name: Sonda de cronogramas
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Buscar una fuente con los flujos de fondos
        run: |
          p(){ c=$(curl -s -o /tmp/r -w "%{http_code}" -m 15 -H 'User-Agent: Mozilla/5.0' "$1" 2>/dev/null||echo ERR)
               n=$(wc -c </tmp/r 2>/dev/null||echo 0)
               printf "%-5s %8s  %s\n" "$c" "$n" "$2"
               # el || true es necesario: el runner corre con bash -e y sin esto
               # el primer 404 aborta la sonda entera
               { [ "$c" = "200" ] && [ "$n" -gt 30 ] && echo "      $(head -c 300 /tmp/r|tr -d '\n')"; } || true; }
          echo "== data912: otros endpoints =="
          for e in arg_bonds_flows bonds_flows flows arg_bonds_info cashflow arg_notes arg_bills; do
            p "https://data912.com/live/$e" "live/$e"; done
          p "https://data912.com/info/arg_bonds" "info/arg_bonds"
          p "https://data912.com/docs" "docs"
          p "https://data912.com/openapi.json" "openapi.json"
          echo
          echo "== otras fuentes con flujos =="
          p "https://api.invertironline.com/api/v2/Titulos/BCBA/AL30" "IOL"
          p "https://mercados.ambito.com/bonos/al30/historico-general/2026-08-01/2026-09-01" "Ambito"
          p "https://api.argentinadatos.com/v1/finanzas/rendimientos" "argentinadatos rendimientos"
          p "https://api.argentinadatos.com/v1/finanzas/indices/riesgo-pais/ultimo" "argentinadatos riesgo pais"
          p "https://bonistas.com/api/bonos" "bonistas"
