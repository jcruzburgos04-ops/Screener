# =============================================================================
# Renueva el panel de CEDEARs contra la lista que se negocia de verdad.
#
# A mano (workflow_dispatch), no por cron: el panel cambia cada varios meses y
# los que no se mapean solos hay que mirarlos igual. Con "escribir" en true
# ademas commitea cedears.csv.
# =============================================================================
name: Renovar el panel de CEDEARs

on:
  workflow_dispatch:
    inputs:
      escribir:
        description: "Agregar al cedears.csv los que se mapean solos"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Comparar contra el panel
        run: |
          if [ "${{ inputs.escribir }}" = "true" ]; then
            python armar_universo.py --escribir
          else
            python armar_universo.py
          fi
      - name: Commitear si cambio
        if: inputs.escribir
        run: |
          if git diff --quiet -- cedears.csv; then
            echo "cedears.csv no cambio"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cedears.csv
          git commit -m "Renovar el panel de CEDEARs contra la rueda"
          git push
